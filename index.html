<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的团队 · 成员展示</title>
    <!-- Bootstrap 5 核心样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 轻微自定义：卡片图片裁剪 + 柔和阴影 -->
    <style>
        body {
            background: #f8faff;
        }
        .card-img-top {
            height: 200px;
            object-fit: cover;
            background-color: #e9ecef;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0.75rem 1.5rem rgba(0,0,0,0.08);
        }
        .badge {
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .filter-section {
            background: white;
            padding: 1.25rem 1.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.02);
            margin-bottom: 2rem;
        }
        .comment-placeholder {
            background: white;
            padding: 2rem 1.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.02);
        }
        .member-grid {
            row-gap: 1.5rem;
        }
        .btn-outline-primary {
            border-width: 1.5px;
        }
        /* 空状态提示 */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <!-- 页面标题 -->
        <div class="text-center mb-5">
            <h1 class="fw-light">👥 小组成员展示</h1>
            <p class="text-muted">AEG 运营 · 渠道 · 协作</p>
        </div>

        <!-- 搜索 & 筛选卡片 -->
        <div class="filter-section row g-3 align-items-end">
            <div class="col-md-6">
                <label for="searchInput" class="form-label fw-semibold small text-secondary">🔍 搜索</label>
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="姓名、角色或技能...">
            </div>
            <div class="col-md-6">
                <label for="roleFilter" class="form-label fw-semibold small text-secondary">📌 角色筛选</label>
                <select id="roleFilter" class="form-select form-select-lg">
                    <option value="">全部角色</option>
                </select>
            </div>
        </div>

        <!-- 成员卡片网格 -->
        <div class="row member-grid" id="memberGrid">
            <!-- 由 JavaScript 动态渲染 -->
        </div>

        <!-- 留言区占位 (保留 Giscus 风格) -->
        <hr class="my-5 opacity-25">
        <div class="comment-placeholder">
            <h5 class="mb-2 fw-normal">💬 留言区</h5>
            <p class="text-muted small mb-0">评论区加载中 (可替换为 Giscus / 其他)</p>
        </div>
    </div>

    <!-- ========== JavaScript ========== -->
    <script>
        (function() {
            "use strict";

            // ============================================================
            //  1. 成员数据 —————— 按需修改，字段名保持一致
            // ============================================================
            const members = [
                {
                    name: "王佳音",
                    role: "组长",
                    bio: "AEG产品运营专员 · 统筹协调",
                    skills: ["福建", "厦门"],
                    avatar: "https://via.placeholder.com/400x250/6c8cff/ffffff?text=王佳音",
                    github: "https://github.com/zhangsan"
                },
                {
                    name: "廖晴宇",
                    role: "组员",
                    bio: "AEG运营专员 · 数据分析",
                    skills: ["湖北", "襄阳"],
                    avatar: "https://raw.githubusercontent.com/summerlia666/summerlia666.github.io/main/%E5%BB%96%E6%99%B4%E5%AE%87.jpg",
                    github: "https://github.com/lisi"
                },
                {
                    name: "王笑然",
                    role: "组员",
                    bio: "AEG运营专员 · 内容策划",
                    skills: ["山西", "晋城"],
                    avatar: "https://raw.githubusercontent.com/summerlia666/summerlia666.github.io/main/%E7%8E%8B%E7%AC%91%E7%84%B6.jpg",
                    github: "https://github.com/wangwu"
                },
                {
                    name: "王浩源",
                    role: "组员",
                    bio: "AEG渠道销售专员 · 大客户",
                    skills: ["内蒙古", "呼和浩特"],
                    avatar: "https://raw.githubusercontent.com/summerlia666/summerlia666.github.io/main/%E7%8E%8B%E6%B5%A9%E6%BA%90.jpg",
                    github: "https://github.com/wangwu"
                }
            ];

            // ============================================================
            //  2. DOM 引用 & 辅助函数
            // ============================================================
            const grid = document.getElementById('memberGrid');
            const searchInput = document.getElementById('searchInput');
            const roleFilter = document.getElementById('roleFilter');

            // 渲染成员卡片 (接收数组)
            function renderMembers(memberList) {
                if (!memberList || memberList.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12">
                            <div class="empty-state">
                                <div style="font-size: 2.8rem; opacity: 0.3; margin-bottom: 0.5rem;">🔎</div>
                                <h5 class="fw-normal">没有找到匹配的成员</h5>
                                <p class="text-muted small">试试调整搜索词或筛选条件</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                // 用 DocumentFragment 批量构建，提高性能
                const fragment = document.createDocumentFragment();

                memberList.forEach(member => {
                    // 技能标签
                    const skillsHtml = member.skills && member.skills.length
                        ? member.skills.map(s => `<span class="badge bg-secondary me-1">${escapeHtml(s)}</span>`).join('')
                        : '';

                    // GitHub 按钮（可选）
                    const githubBtn = member.github
                        ? `<a href="${escapeHtml(member.github)}" target="_blank" class="btn btn-sm btn-outline-primary mt-1">GitHub</a>`
                        : '';

                    // 卡片 HTML
                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-6 mb-4 d-flex align-items-stretch'; // 保证卡片等高
                    col.innerHTML = `
                        <div class="card w-100 shadow-sm">
                            <img src="${escapeHtml(member.avatar)}" class="card-img-top" alt="${escapeHtml(member.name)}" loading="lazy">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-semibold">${escapeHtml(member.name)}</h5>
                                <h6 class="card-subtitle mb-2 text-muted">${escapeHtml(member.role)}</h6>
                                <p class="card-text" style="flex: 1;">${escapeHtml(member.bio)}</p>
                                <div class="mb-2">${skillsHtml}</div>
                                <div>${githubBtn}</div>
                            </div>
                        </div>
                    `;
                    fragment.appendChild(col);
                });

                grid.innerHTML = '';
                grid.appendChild(fragment);
            }

            // 简单的转义防止 XSS (对数据可信但保持习惯)
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============================================================
            //  3. 筛选逻辑
            // ============================================================
            function filterMembers() {
                const searchTerm = searchInput.value.trim().toLowerCase();
                const selectedRole = roleFilter.value;

                const filtered = members.filter(m => {
                    // 搜索匹配：姓名 / 角色 / 技能 (所有技能拼接)
                    const skillsString = (m.skills || []).join(' ').toLowerCase();
                    const matchSearch = 
                        m.name.toLowerCase().includes(searchTerm) ||
                        m.role.toLowerCase().includes(searchTerm) ||
                        skillsString.includes(searchTerm);

                    // 角色匹配
                    const matchRole = selectedRole === '' || m.role === selectedRole;

                    return matchSearch && matchRole;
                });

                renderMembers(filtered);
            }

            // ============================================================
            //  4. 初始化：填充角色下拉 + 注册事件 + 首次渲染
            // ============================================================
            function populateRoleFilter() {
                // 提取所有唯一角色
                const roleSet = new Set();
                members.forEach(m => {
                    if (m.role) roleSet.add(m.role);
                });
                // 保留 "全部角色" 选项 (已存在)
                roleFilter.innerHTML = `<option value="">全部角色</option>`;
                roleSet.forEach(role => {
                    const option = document.createElement('option');
                    option.value = role;
                    option.textContent = role;
                    roleFilter.appendChild(option);
                });
            }

            // 挂载事件
            function init() {
                populateRoleFilter();
                // 初始渲染全部成员
                renderMembers(members);

                // 监听输入 & 下拉变化
                searchInput.addEventListener('input', filterMembers);
                roleFilter.addEventListener('change', filterMembers);

                // 可选：如果希望点击"清除"或回车不提交，这里已经足够了
            }

            // 当 DOM 完全加载后执行
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

    <!-- Bootstrap JS 可选 (仅用于交互，本例非必须) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
